<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จักรวาลแห่งดวงดาว | งานนิทรรศการ</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --cosmic-bg-1: #05030f;
            --cosmic-bg-2: #0d0826;
            --cosmic-bg-3: #1a0f3d;
            --violet: #a855f7;
            --violet-deep: #7c3aed;
            --cyan: #22d3ee;
            --cyan-deep: #06b6d4;
            --gold: #fbbf24;
            --rose: #f472b6;
            --text-bright: #F2EEFF;
            --text-soft: #C5BDF0;
            --text-muted: #8E86C0;
        }

        body {
            font-family: 'IBM Plex Sans Thai', sans-serif;
            overflow-x: hidden;
            background:
                radial-gradient(1200px 800px at 15% -10%, rgba(124, 58, 237, 0.30), transparent 60%),
                radial-gradient(1000px 700px at 110% 10%, rgba(6, 182, 212, 0.22), transparent 55%),
                radial-gradient(900px 900px at 50% 120%, rgba(236, 72, 153, 0.18), transparent 60%),
                linear-gradient(160deg, var(--cosmic-bg-1) 0%, var(--cosmic-bg-2) 45%, var(--cosmic-bg-3) 100%);
            background-attachment: fixed;
        }
        h1, h2 { font-family: 'Chakra Petch', 'IBM Plex Sans Thai', sans-serif; }

        /* Color Variables & Utilities */
        .text-glow-purple {
            color: var(--violet);
            text-shadow: 0 0 22px rgba(168, 85, 247, 0.7);
        }
        .text-glow-pink {
            color: var(--rose);
            text-shadow: 0 0 22px rgba(244, 114, 182, 0.7);
        }
        .text-gold {
            color: var(--gold);
            text-shadow: 0 0 16px rgba(251, 191, 36, 0.6);
        }

        /* Animated Background */
        .space-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background: linear-gradient(135deg, var(--cosmic-bg-1) 0%, var(--cosmic-bg-2) 50%, var(--cosmic-bg-3) 100%);
        }
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }
        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            animation: float 40s infinite linear;
        }
        @keyframes float {
            from { transform: translate(0, 0) rotate(0deg); }
            to { transform: translate(20vw, -10vh) rotate(360deg); }
        }
        .shooting-star {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, #fff, var(--violet));
            transform: rotate(-45deg);
            opacity: 0;
            animation: shoot 4s forwards;
            box-shadow: 0 0 10px var(--violet);
        }
        @keyframes shoot {
            0% { width: 0; opacity: 0; transform: translate(0, 0) rotate(-45deg); }
            10% { opacity: 1; }
            20% { width: 150px; opacity: 0; transform: translate(100px, 100px) rotate(-45deg); }
            100% { opacity: 0; }
        }

        /* UI Components */
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(8px);
        }
        .modal-card {
            background: rgba(26, 15, 61, 0.92);
            border: 1px solid rgba(168, 85, 247, 0.4);
            box-shadow: 0 0 50px rgba(168, 85, 247, 0.3);
        }
        .form-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(168, 85, 247, 0.3);
            color: #fff;
            font-family: 'IBM Plex Sans Thai', sans-serif;
            transition: all 0.3s;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--cyan);
            background: rgba(34, 211, 238, 0.08);
            box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.12), 0 0 18px rgba(34, 211, 238, 0.25);
        }
        .form-input option { background: var(--cosmic-bg-2); color: #fff; }
        .btn-primary {
            background: linear-gradient(45deg, var(--violet-deep), var(--violet), var(--rose));
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-family: 'Chakra Petch', sans-serif;
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
            transition: 0.5s;
        }
        .btn-primary:hover::after {
            left: 100%;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(168, 85, 247, 0.55);
        }

        .counter-display {
            background: rgba(13, 8, 38, 0.6);
            border: 1px solid rgba(251, 191, 36, 0.3);
            box-shadow: 0 0 22px rgba(251, 191, 36, 0.12);
            backdrop-filter: blur(10px);
        }
        .counter-number {
            background: linear-gradient(to right, var(--gold), #fff, var(--rose));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Chakra Petch', sans-serif;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        /* Floating planet character (hero) */
        .hero-planet {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 1rem;
            animation: floaty 4s ease-in-out infinite;
        }
        @keyframes floaty {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-14px); }
        }
        .hero-planet-orb {
            position: absolute;
            inset: 18%;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 28%, #f3e8ff, var(--violet) 55%, #2a0a4a 100%);
            box-shadow: 0 0 44px var(--violet), inset -14px -16px 34px rgba(0,0,0,0.45), inset 8px 10px 20px rgba(255,255,255,0.18);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.8rem;
        }
        .hero-planet-ring {
            position: absolute; inset: 0; border-radius: 50%;
            border: 1.5px dashed rgba(255,255,255,0.35);
            animation: spin-slow 18s linear infinite;
        }
        .hero-planet-ring::after {
            content: ''; position: absolute; top: -5px; left: 50%;
            width: 10px; height: 10px; border-radius: 50%;
            background: #fff; box-shadow: 0 0 12px var(--violet);
        }
        @keyframes spin-slow { to { transform: rotate(360deg); } }

        /* Sparkle Effect */
        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: var(--gold);
            border-radius: 50%;
            pointer-events: none;
            animation: sparkle-fall 1s ease-out forwards;
            box-shadow: 0 0 10px var(--gold);
        }
        @keyframes sparkle-fall {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body class="text-white min-h-screen relative flex flex-col items-center justify-center p-4 selection:bg-purple-500 selection:text-white">

<!-- Twinkling Background Elements -->
<div class="space-background" id="space-bg"></div>

<!-- Main Content -->
<div class="relative z-10 w-full max-w-4xl mx-auto text-center animate-fade-in-up">
    
    <!-- Header -->
    <div class="mb-8">
        <div class="hero-planet">
            <div class="hero-planet-orb">🌌</div>
            <div class="hero-planet-ring"></div>
        </div>
        <h1 class="text-5xl md:text-7xl font-bold mb-4 tracking-tight leading-tight">
            ยินดีต้อนรับสู่ <br>
            <span class="text-glow-purple">จักรวาล</span> แห่ง <span class="text-gold">ดวงดาว</span>
        </h1>
        <p class="text-lg md:text-xl text-gray-300 font-light mt-4 max-w-2xl mx-auto">
            ค้นพบตัวตนที่ซ่อนอยู่ผ่านกลุ่มดาวของคุณ<br>
            ร่วมเป็นส่วนหนึ่งในการสร้างสรรค์โลกใบใหม่
        </p>
    </div>

    <!-- Counter Card -->
    <div class="counter-display rounded-2xl p-6 mb-12 inline-block transform hover:scale-105 transition-transform duration-300">
        <p class="text-gray-400 text-sm uppercase tracking-widest mb-2">มีดวงดาวเข้าร่วมจักรวาลแล้ว</p>
        <div class="flex justify-center items-baseline space-x-2">
            <span id="counter-number" class="counter-number text-5xl md:text-7xl font-bold">987</span>
            <span class="text-xl text-gray-400">ดวง</span>
        </div>
        <div class="mt-3 flex justify-center items-center space-x-2">
            <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse shadow-[0_0_10px_#4ade80]"></div>
            <span class="text-xs text-green-400 font-medium">Real-time Activity</span>
        </div>
    </div>

    <!-- CTA Button -->
    <button id="checkinBtn" class="btn-primary text-xl md:text-2xl font-semibold py-4 px-12 rounded-full shadow-[0_0_30px_rgba(124,77,255,0.4)] border border-purple-400/30">
        เช็คชื่อเข้างาน
    </button>

    <!-- Modal Form -->
    <div id="modal" class="fixed inset-0 modal-overlay flex items-center justify-center p-4 hidden z-[100] opacity-0 transition-opacity duration-300">
        <div class="modal-card rounded-2xl p-8 w-full max-w-md relative transform scale-95 transition-transform duration-300" id="modalContent">
            
            <!-- Close Button -->
            <button id="closeModal" class="absolute top-4 right-4 text-gray-400 hover:text-white hover:rotate-90 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">ลงทะเบียนเข้าสู่ระบบ</h2>
                <p class="text-sm text-gray-400 mt-2">กรุณาเลือกประเภทและกรอกข้อมูลให้ครบถ้วน</p>
            </div>

            <form id="checkinForm">
                <div class="mb-6">
                    <label class="block text-left mb-2 text-sm font-medium text-purple-300">ประเภทของคุณ</label>
                    <div class="relative">
                        <select id="typeSelect" class="form-input w-full p-3 rounded-lg appearance-none cursor-pointer">
                            <option value="student">นิสิต / นักศึกษา</option>
                            <option value="staff">บุคลากร</option>
                            <option value="external">บุคคลภายนอก</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-purple-400">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>

                <div id="formFields" class="space-y-4">
                    <!-- Fields will be dynamically inserted here -->
                </div>

                <button type="submit" class="btn-primary w-full py-3.5 rounded-lg mt-8 font-bold tracking-wide shadow-lg">
                    บันทึกและเริ่มสำรวจ
                </button>
            </form>
        </div>
    </div>

</div>

<script>
    // --- 1. Background Animation Logic ---
    const bgContainer = document.getElementById('space-bg');
    const colors = ['#ffffff', '#a855f7', '#22d3ee', '#fbbf24', '#f472b6'];
    
    // Create Stars
    for (let i = 0; i < 200; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 100}%`;
        const size = Math.random() * 3;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
        star.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        bgContainer.appendChild(star);
    }

    // Create Nebulas
    for (let i = 0; i < 4; i++) {
        const neb = document.createElement('div');
        neb.classList.add('nebula');
        const size = Math.random() * 400 + 200;
        neb.style.width = `${size}px`;
        neb.style.height = `${size}px`;
        neb.style.left = `${Math.random() * 100}%`;
        neb.style.top = `${Math.random() * 100}%`;
        neb.style.backgroundColor = colors[Math.floor(Math.random() * 2)]; // Use white or purple mostly
        bgContainer.appendChild(neb);
    }

    // Shooting Stars Interval
    setInterval(() => {
        const shooter = document.createElement('div');
        shooter.classList.add('shooting-star');
        shooter.style.top = `${Math.random() * 80}%`; // Keep mostly in upper area
        shooter.style.left = `${Math.random() * 100}%`;
        bgContainer.appendChild(shooter);
        setTimeout(() => shooter.remove(), 4000);
    }, 6000);

    // --- 2. Modal & Form Logic ---
    const modal = document.getElementById('modal');
    const modalContent = document.getElementById('modalContent');
    const checkinBtn = document.getElementById('checkinBtn');
    const closeModal = document.getElementById('closeModal');
    const typeSelect = document.getElementById('typeSelect');
    const formFields = document.getElementById('formFields');

    function openModal() {
        modal.classList.remove('hidden');
        // Small delay to allow display:block to apply before opacity transition
        setTimeout(() => {
            modal.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
        }, 10);
    }

    function closeModalFunc() {
        modal.classList.add('opacity-0');
        modalContent.classList.remove('scale-100');
        modalContent.classList.add('scale-95');
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 300);
    }

    function updateFormFields() {
        const type = typeSelect.value;
        let fieldsHTML = '';
        const inputClass = "form-input w-full p-3 rounded-lg placeholder-gray-500 text-sm";

        if (type === 'student') {
            fieldsHTML = `
                <div class="animate-fade-in"><input type="text" name="staff_id" placeholder="รหัสนิสิต (Student ID)" class="${inputClass}" required></div>
                <div class="animate-fade-in"><input type="text" name="name" placeholder="ชื่อ-นามสกุล" class="${inputClass}" required></div>
                <div class="animate-fade-in"><input type="text" name="faculty" placeholder="คณะ" class="${inputClass}" required></div>
            `;
        } else if (type === 'staff') {
            fieldsHTML = `
                <div class="animate-fade-in"><input type="text" name="name" placeholder="ชื่อ-นามสกุล" class="${inputClass}" required></div>
                <div class="animate-fade-in"><input type="text" name="staff_id" placeholder="รหัสพนักงาน (ถ้ามี)" class="${inputClass}"></div>
                <div class="animate-fade-in"><input type="text" name="position" placeholder="ตำแหน่ง" class="${inputClass}" required></div>
                <div class="animate-fade-in"><input type="text" name="faculty" placeholder="คณะ/หน่วยงาน" class="${inputClass}" required></div>
            `;
        } else { // external
            fieldsHTML = `
                <div class="animate-fade-in"><input type="text" name="name" placeholder="ชื่อ-นามสกุล" class="${inputClass}" required></div>
                <div class="animate-fade-in"><input type="text" name="occupation" placeholder="อาชีพ" class="${inputClass}" required></div>
            `;
        }
        formFields.innerHTML = fieldsHTML;
    }

    typeSelect.addEventListener('change', updateFormFields);
    updateFormFields(); // Initialize

    checkinBtn.addEventListener('click', openModal);
    closeModal.addEventListener('click', closeModalFunc);
    
    // Close on click outside
    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModalFunc();
    });

    // --- 3. Form Submission & Sparkle Effect ---
    document.getElementById('checkinForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const submitBtn = this.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = 'กำลังบันทึก...';

        const formData = new FormData(this);
        const payload = Object.fromEntries(formData.entries());
        payload.user_type = typeSelect.value;

        try {
            const response = await fetch('/api/checkin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });

            const result = await response.json();

            if (response.ok && result.success) {
                closeModalFunc();
                triggerSparkleEffect(window.innerWidth / 2, window.innerHeight / 2);
                updateLiveCounter();
                alert(result.message || 'บันทึกข้อมูลเรียบร้อย!');
                this.reset();
                updateFormFields();
            } else {
                alert(result.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
            }
        } catch (error) {
            alert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาเปิดผ่าน http://localhost:8080');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
        }
    });

    function triggerSparkleEffect(x, y) {
        const particleCount = 120;
        for (let i = 0; i < particleCount; i++) {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            
            // Start from center
            sparkle.style.left = `${x}px`;
            sparkle.style.top = `${y}px`;
            
            // Random direction
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 200 + 100; // Distance
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;
            
            sparkle.style.setProperty('--tx', `${tx}px`);
            sparkle.style.setProperty('--ty', `${ty}px`);
            
            // Random colors
            sparkle.style.backgroundColor = ['#fbbf24', '#a855f7', '#22d3ee', '#f472b6', '#FFFFFF'][Math.floor(Math.random() * 5)];
            
            document.body.appendChild(sparkle);

            setTimeout(() => {
                sparkle.remove();
            }, 1000);
        }
    }

    // --- 4. Live Counter ---
    const counterEl = document.getElementById('counter-number');

    async function updateLiveCounter() {
        try {
            const response = await fetch('/api/checkin/count');
            const data = await response.json();
            if (counterEl && typeof data.count === 'number') {
                counterEl.textContent = data.count.toLocaleString();
            }
        } catch (error) {
            console.error('Error fetching check-in count:', error);
        }
    }

    updateLiveCounter();
    setInterval(updateLiveCounter, 5000);

</script>

</body>
</html>
