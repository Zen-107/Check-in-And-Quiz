<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จักรวาลแห่งดวงดาว | งานนิทรรศการ</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans Thai', sans-serif;
            overflow-x: hidden;
            background-color: #0B0F26; /* Fallback */
        }
        
        /* Color Variables & Utilities */
        .text-glow-purple {
            color: #7C4DFF;
            text-shadow: 0 0 15px rgba(124, 77, 255, 0.6);
        }
        .text-glow-pink {
            color: #E040FB;
            text-shadow: 0 0 15px rgba(224, 64, 251, 0.6);
        }
        .text-gold {
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* Animated Background */
        .space-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background: linear-gradient(135deg, #0B0F26 0%, #1A1C38 50%, #2a1b3d 100%);
        }
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: float 40s infinite linear;
        }
        @keyframes float {
            from { transform: translate(0, 0) rotate(0deg); }
            to { transform: translate(20vw, -10vh) rotate(360deg); }
        }
        .shooting-star {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, #fff, #7C4DFF);
            transform: rotate(-45deg);
            opacity: 0;
            animation: shoot 4s forwards;
            box-shadow: 0 0 10px #7C4DFF;
        }
        @keyframes shoot {
            0% { width: 0; opacity: 0; transform: translate(0, 0) rotate(-45deg); }
            10% { opacity: 1; }
            20% { width: 150px; opacity: 0; transform: translate(100px, 100px) rotate(-45deg); }
            100% { opacity: 0; }
        }

        /* UI Components */
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
        }
        .modal-card {
            background: rgba(26, 28, 56, 0.95);
            border: 1px solid rgba(124, 77, 255, 0.4);
            box-shadow: 0 0 30px rgba(124, 77, 255, 0.2);
        }
        .form-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(124, 77, 255, 0.3);
            color: #fff;
            transition: all 0.3s;
        }
        .form-input:focus {
            outline: none;
            border-color: #E040FB;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(224, 64, 251, 0.3);
        }
        .btn-primary {
            background: linear-gradient(45deg, #7C4DFF, #E040FB);
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }
        .btn-primary:hover::after {
            left: 100%;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(224, 64, 251, 0.5);
        }

        .counter-display {
            background: rgba(11, 15, 38, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        .counter-number {
            background: linear-gradient(to right, #FFD700, #FDB931, #E040FB);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        /* Sparkle Effect */
        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #FFD700;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkle-fall 1s ease-out forwards;
            box-shadow: 0 0 10px #FFD700;
        }
        @keyframes sparkle-fall {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body class="text-white min-h-screen relative flex flex-col items-center justify-center p-4 selection:bg-purple-500 selection:text-white">

<!-- Twinkling Background Elements -->
<div class="space-background" id="space-bg"></div>

<!-- Main Content -->
<div class="relative z-10 w-full max-w-4xl mx-auto text-center animate-fade-in-up">
    
    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-5xl md:text-7xl font-bold mb-4 tracking-tight leading-tight">
            ยินดีต้อนรับสู่ <br>
            <span class="text-glow-purple">จักรวาล</span> แห่ง <span class="text-gold">ดวงดาว</span>
        </h1>
        <p class="text-lg md:text-xl text-gray-300 font-light mt-4 max-w-2xl mx-auto">
            ค้นพบตัวตนที่ซ่อนอยู่ผ่านกลุ่มดาวของคุณ<br>
            ร่วมเป็นส่วนหนึ่งในการสร้างสรรค์โลกใบใหม่
        </p>
    </div>

    <!-- Counter Card -->
    <div class="counter-display rounded-2xl p-6 mb-12 inline-block transform hover:scale-105 transition-transform duration-300">
        <p class="text-gray-400 text-sm uppercase tracking-widest mb-2">มีดวงดาวเข้าร่วมจักรวาลแล้ว</p>
        <div class="flex justify-center items-baseline space-x-2">
            <span id="counter-number" class="counter-number text-5xl md:text-7xl font-bold">987</span>
            <span class="text-xl text-gray-400">ดวง</span>
        </div>
        <div class="mt-3 flex justify-center items-center space-x-2">
            <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse shadow-[0_0_10px_#4ade80]"></div>
            <span class="text-xs text-green-400 font-medium">Real-time Activity</span>
        </div>
    </div>

    <!-- CTA Button -->
    <button id="checkinBtn" class="btn-primary text-xl md:text-2xl font-semibold py-4 px-12 rounded-full shadow-[0_0_30px_rgba(124,77,255,0.4)] border border-purple-400/30">
        เช็คชื่อเข้างาน
    </button>

    <!-- Modal Form -->
    <div id="modal" class="fixed inset-0 modal-overlay flex items-center justify-center p-4 hidden z-[100] opacity-0 transition-opacity duration-300">
        <div class="modal-card rounded-2xl p-8 w-full max-w-md relative transform scale-95 transition-transform duration-300" id="modalContent">
            
            <!-- Close Button -->
            <button id="closeModal" class="absolute top-4 right-4 text-gray-400 hover:text-white hover:rotate-90 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">ลงทะเบียนเข้าสู่ระบบ</h2>
                <p class="text-sm text-gray-400 mt-2">กรุณาเลือกประเภทและกรอกข้อมูลให้ครบถ้วน</p>
            </div>

            <form id="checkinForm">
                <div class="mb-6">
                    <label class="block text-left mb-2 text-sm font-medium text-purple-300">ประเภทของคุณ</label>
                    <div class="relative">
                        <select id="typeSelect" class="form-input w-full p-3 rounded-lg appearance-none cursor-pointer">
                            <option value="student">นิสิต / นักศึกษา</option>
                            <option value="staff">บุคลากร</option>
                            <option value="external">บุคคลภายนอก</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-purple-400">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>

                <div id="formFields" class="space-y-4">
                    <!-- Fields will be dynamically inserted here -->
                </div>

                <button type="submit" class="btn-primary w-full py-3.5 rounded-lg mt-8 font-bold tracking-wide shadow-lg">
                    บันทึกและเริ่มสำรวจ
                </button>
            </form>
        </div>
    </div>

</div>

<script>
    // --- 1. Background Animation Logic ---
    const bgContainer = document.getElementById('space-bg');
    const colors = ['#ffffff', '#7C4DFF', '#E040FB', '#FFD700'];
    
    // Create Stars
    for (let i = 0; i < 200; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 100}%`;
        const size = Math.random() * 3;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
        star.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        bgContainer.appendChild(star);
    }

    // Create Nebulas
    for (let i = 0; i < 4; i++) {
        const neb = document.createElement('div');
        neb.classList.add('nebula');
        const size = Math.random() * 400 + 200;
        neb.style.width = `${size}px`;
        neb.style.height = `${size}px`;
        neb.style.left = `${Math.random() * 100}%`;
        neb.style.top = `${Math.random() * 100}%`;
        neb.style.backgroundColor = colors[Math.floor(Math.random() * 2)]; // Use white or purple mostly
        bgContainer.appendChild(neb);
    }

    // Shooting Stars Interval
    setInterval(() => {
        const shooter = document.createElement('div');
        shooter.classList.add('shooting-star');
        shooter.style.top = `${Math.random() * 80}%`; // Keep mostly in upper area
        shooter.style.left = `${Math.random() * 100}%`;
        bgContainer.appendChild(shooter);
        setTimeout(() => shooter.remove(), 4000);
    }, 6000);

    // --- 2. Modal & Form Logic ---
    const modal = document.getElementById('modal');
    const modalContent = document.getElementById('modalContent');
    const checkinBtn = document.getElementById('checkinBtn');
    const closeModal = document.getElementById('closeModal');
    const typeSelect = document.getElementById('typeSelect');
    const formFields = document.getElementById('formFields');

    function openModal() {
        modal.classList.remove('hidden');
        // Small delay to allow display:block to apply before opacity transition
        setTimeout(() => {
            modal.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
        }, 10);
    }

    function closeModalFunc() {
        modal.classList.add('opacity-0');
        modalContent.classList.remove('scale-100');
        modalContent.classList.add('scale-95');
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 300);
    }

    function updateFormFields() {
        const type = typeSelect.value;
        let fieldsHTML = '';
        const inputClass = "form-input w-full p-3 rounded-lg placeholder-gray-500 text-sm";

        if (type === 'student') {
            fieldsHTML = `
                <div class="animate-fade-in"><input type="text" placeholder="รหัสนิสิต (Student ID)" class="${inputClass}" required></div>
                <div class="animate-fade-in"><input type="text" placeholder="ชื่อ-นามสกุล" class="${inputClass}" required></div>
                <div class="animate-fade-in"><input type="email" placeholder="อีเมลสถาบัน" class="${inputClass}"></div>
                <div class="animate-fade-in"><input type="text" placeholder="คณะ" class="${inputClass}"></div>
            `;
        } else if (type === 'staff') {
            fieldsHTML = `
                <div class="animate-fade-in"><input type="text" placeholder="ชื่อ-นามสกุล" class="${inputClass}" required></div>
                <div class="animate-fade-in"><input type="email" placeholder="อีเมล" class="${inputClass}"></div>
                <div class="animate-fade-in"><input type="text" placeholder="แผนก / ฝ่าย" class="${inputClass}"></div>
                <div class="animate-fade-in"><input type="tel" placeholder="เบอร์โทรติดต่อ" class="${inputClass}"></div>
            `;
        } else { // external
            fieldsHTML = `
                <div class="animate-fade-in"><input type="text" placeholder="ชื่อ-นามสกุล" class="${inputClass}" required></div>
                <div class="animate-fade-in"><input type="email" placeholder="อีเมล" class="${inputClass}"></div>
                <div class="animate-fade-in"><input type="text" placeholder="หน่วยงาน / องค์กร" class="${inputClass}"></div>
                <div class="animate-fade-in"><input type="tel" placeholder="เบอร์โทรติดต่อ" class="${inputClass}"></div>
            `;
        }
        formFields.innerHTML = fieldsHTML;
    }

    typeSelect.addEventListener('change', updateFormFields);
    updateFormFields(); // Initialize

    checkinBtn.addEventListener('click', openModal);
    closeModal.addEventListener('click', closeModalFunc);
    
    // Close on click outside
    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModalFunc();
    });

    // --- 3. Form Submission & Sparkle Effect ---
    document.getElementById('checkinForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Hide modal
        closeModalFunc();

        // Trigger sparkle effect from center of screen
        triggerSparkleEffect(window.innerWidth / 2, window.innerHeight / 2);

        // Simulate processing and redirect
        setTimeout(() => {
            // In real app: window.location.href = 'quiz.html';
            alert("บันทึกข้อมูลเรียบร้อย! เตรียมตัวพบกับดวงดาวของคุณ...");
            console.log("Redirecting to quiz.html...");
        }, 1500);
    });

    function triggerSparkleEffect(x, y) {
        const particleCount = 120;
        for (let i = 0; i < particleCount; i++) {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            
            // Start from center
            sparkle.style.left = `${x}px`;
            sparkle.style.top = `${y}px`;
            
            // Random direction
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 200 + 100; // Distance
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;
            
            sparkle.style.setProperty('--tx', `${tx}px`);
            sparkle.style.setProperty('--ty', `${ty}px`);
            
            // Random colors
            sparkle.style.backgroundColor = ['#FFD700', '#7C4DFF', '#E040FB', '#FFFFFF'][Math.floor(Math.random() * 4)];
            
            document.body.appendChild(sparkle);

            setTimeout(() => {
                sparkle.remove();
            }, 1000);
        }
    }

    // --- 4. Live Counter Simulation ---
    const counterEl = document.getElementById('counter-number');
    let currentCount = 987;
    
    function incrementCounter() {
        // Randomly increment every 2-5 seconds
        const nextIncrement = Math.random() * 3000 + 2000;
        
        setTimeout(() => {
            const increase = Math.floor(Math.random() * 3) + 1; // Increase by 1-3
            currentCount += increase;
            counterEl.textContent = currentCount.toLocaleString();
            
            // Add a little pulse effect
            counterEl.classList.add('scale-110');
            setTimeout(() => counterEl.classList.remove('scale-110'), 200);
            
            incrementCounter();
        }, nextIncrement);
    }
    
    incrementCounter();

</script>

</body>
</html>
