version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: checkin_quiz_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: checkin_quiz
      MYSQL_USER: quizuser
      MYSQL_PASSWORD: quizpassword
    ports:
      - "3306:3306"
    volumes:
      # สร้าง Volume ถาวร ชื่อ mysql_data ข้อมูลจะไม่หายแม้ลบ container
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go Backend Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: checkin_quiz_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: quizuser
      DB_PASSWORD: quizpassword
      DB_NAME: checkin_quiz
      PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - app_network

volumes:
  mysql_data:
    driver: local

networks:
  app_network:
    driver: bridge
