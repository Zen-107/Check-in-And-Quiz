version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: checkin_quiz_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: checkin_quiz
      MYSQL_USER: quizuser
      MYSQL_PASSWORD: quizpassword
    ports:
      - "3306:3306"
    volumes:
      # สร้าง Volume ถาวร ชื่อ mysql_data ข้อมูลจะไม่หายแม้ลบ container
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - app_network

volumes:
  mysql_data:
    driver: local

networks:
  app_network:
    driver: bridge
